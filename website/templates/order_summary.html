{% extends "base.html" %}

{% block body %}
<div class="p-strip" style="padding: 2rem; background-color: #f9f9f9;">
    <h2 class="p-heading--large">Order Summary</h2>
    <div class="p-card" style="max-width: 600px; margin: 0 auto; padding: 2rem; background-color: #fff; border-radius: 12px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
        <div class="p-card__content" style="padding: 1rem;">
            <h3 class="p-heading--medium">{{ product.name }}</h3>
            <p>{{ product.description }}</p>
            <p><strong>Price:</strong> Rs {{ product.price }}</p>
        </div>
        <form action="" method="POST">
            <button type="submit" class="p-button--positive" style="width: 100%;">Place Order</button>
        </form>
    </div>
</div>
{% endblock %}
