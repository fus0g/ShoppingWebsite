{% extends "base.html" %}

{% block body %}
<div style="display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Main Content Area -->
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 1rem;">
        <div class="p-card" style="width: 100%; max-width: 500px; padding: 2rem;">
            <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column;">
                <h2 style="text-align: center; margin-bottom: 1.5rem;">Create a New Product</h2>

                <!-- Product Name Field -->
                <label for="name">Product Name</label>
                <input type="text" id="name" name="name" placeholder="Product Name" class="p-form-validation__input" style="margin-bottom: 1rem;" required>

                <!-- Product Description Field -->
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Product Description" class="p-form-validation__input" style="margin-bottom: 1rem;" required></textarea>

                <!-- Product Price Field -->
                <label for="price">Price</label>
                <input type="number" step="0.01" id="price" name="price" placeholder="Product Price" class="p-form-validation__input" style="margin-bottom: 1rem;" required>

                <!-- Product Quantity Field -->
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" placeholder="Product Quantity" class="p-form-validation__input" style="margin-bottom: 1rem;" required>

                <!-- Product Image Field -->
                <label for="image">Product Image</label>
                <input type="file" id="image" name="image" class="p-form-validation__input" style="margin-bottom: 1.5rem;" accept="image/*" required>

                <!-- Create Product Button -->
                <button type="submit" class="p-button--positive">Create Product</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
