{% extends "base.html" %}
{% from "notification.html" import render_notifications %}

{% block nav_login %}
    <li class="p-navigation__item is-selected">
        <a class="p-navigation__link" href="/vendor_login">Vendor Sign in</a>
    </li>
{% endblock %}

{% block body %}
<div style="display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Main Content Area -->
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 1rem;">
        <div class="p-card" style="width: 100%; max-width: 500px; padding: 2rem;">
            <form method="POST" style="display: flex; flex-direction: column;">
                <h2 style="text-align: center; margin-bottom: 1.5rem;">Create a Vendor Account</h2>

                <!-- Vendor Name Field -->
                <label for="vendor_name">Business Name</label>
                <input type="text" id="vendor_name" name="vendor_name" placeholder="Your Business Name" autocomplete="organization" class="p-form-validation__input" style="margin-bottom: 1rem;">

                <!-- Vendor Email Field -->
                <label for="vendor_email">Email address</label>
                <input type="email" id="vendor_email" name="vendor_email" placeholder="example@shopkart.com" autocomplete="email" class="p-form-validation__input" style="margin-bottom: 1rem;">

                <!-- Vendor Password Field -->
                <label for="vendor_password">Password</label>
                <input type="password" id="vendor_password" name="vendor_password" placeholder="******" autocomplete="new-password" class="p-form-validation__input" style="margin-bottom: 1.5rem;">

                <!-- Confirm Password Field -->
                <label for="vendor_confirm_password">Confirm Password</label>
                <input type="password" id="vendor_confirm_password" name="vendor_confirm_password" placeholder="******" autocomplete="new-password" class="p-form-validation__input" style="margin-bottom: 1.5rem;">

                <!-- Sign-Up Button -->
                <button type="submit" name="submit" class="p-button--positive">Sign Up as Vendor</button>
            </form>

            <!-- Already have an account? -->
            <div style="text-align: center; margin-top: 2rem;">
                <p>Already have a vendor account?</p>
                <a href="/vendor_login" class="p-button--neutral">Vendor Sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
